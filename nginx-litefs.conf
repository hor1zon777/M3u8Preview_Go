# LiteFS 节点间复制通道（主备高可用，见 docs/ha-failover.md §9）。
#
# 只在 HA 部署时挂载（docker-compose.ha.yml），单机部署不加载本文件。
#
# 为什么需要它：LiteFS 的节点间 API（20202）**自身没有任何认证**，官方文档明确
# 标注 "MUST NOT be publicly accessible"。而本项目用 network_mode: host，
# 直接监听等于把数据库复制接口裸奔在公网上。因此 LiteFS 绑回环，由这里做
# TLS 加密 + 源 IP 白名单后转发。
#
# 保护手段只有 TLS 与 IP 白名单，没有共享密钥——LiteFS 客户端不支持自定义
# 认证头，加了反而会让复制握手失败。攻击者需要同时伪造对端源 IP 并完成 TCP
# 握手才能触达，配合 TLS 已是这条链路上可行的最强防护。
server {
    listen ${LITEFS_CHANNEL_PORT} ssl;
    http2 on;
    server_name _;

    # 自签证书即可，由 entrypoint 把对端 CA 装进容器信任链（HA_PEER_CA_FILE）。
    ssl_certificate     /etc/nginx/certs/node.crt;
    ssl_certificate_key /etc/nginx/certs/node.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:litefs:1m;

    # 只允许对端节点访问。
    allow ${LITEFS_PEER_IP};
    deny  all;

    location / {
        proxy_pass http://127.0.0.1:20202;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # LiteFS 的复制是长连接流式响应：replica 发一个小请求，primary 持续把 LTX
        # 事务流写回响应体。缓冲会破坏实时性，超时太短会让空闲期的连接被反复掐断。
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # 全量快照可能很大（主节点下线超过 retention 后回归时触发），不设上限。
        client_max_body_size 0;
    }
}
